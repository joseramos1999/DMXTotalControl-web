name: Web

# Builds the site and publishes it on GitHub Pages. Every day too, so a new
# Release of the program and changes to its manual reach the site on their own.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The manual and the release notes come from the program's repository.
      - uses: actions/checkout@v7
        with:
          repository: joseramos1999/DMXTotalControl
          path: app
          sparse-checkout: docs

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run build
        env:
          APP_REPO: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Pages address: github.io/DMXTotalControl-web, or the custom domain once it is set
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
